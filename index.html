<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kikker Assistant</title>
<meta name="description" content="Kikker keeps your day on track: mornings, evenings, projects and bedtime">
<meta name="theme-color" content="#1d3b57">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KikkerAssistant">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one phone-width column. Sky header with Kikker and what's next; cards per part of the day; bottom tabs. */
:root{
  --sky:#1d3b57; --sky-2:#2c5a80; --on-sky:#f3f7fb; --on-sky-dim:#b9cbdc;
  --bg:#eef2f5; --card:#ffffff; --fg:#14202b; --dim:#5b6b79; --line:#d8e0e7;
  --accent:#e08a2c; --accent-soft:#fbe9d5; --good:#2f8f57; --good-soft:#dff2e6; --frog:#2f625f;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#0d1720; --sky-2:#16283a; --on-sky:#eaf1f7; --on-sky-dim:#8fa6ba;
  --bg:#0a1219; --card:#121e29; --fg:#e4ebf1; --dim:#8c9dac; --line:#223241;
  --accent:#f0a24c; --accent-soft:#3a2a17; --good:#5cc489; --good-soft:#15301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#0d1720; --sky-2:#16283a; --on-sky:#eaf1f7; --on-sky-dim:#8fa6ba;
  --bg:#0a1219; --card:#121e29; --fg:#e4ebf1; --dim:#8c9dac; --line:#223241;
  --accent:#f0a24c; --accent-soft:#3a2a17; --good:#5cc489; --good-soft:#15301f; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);background:var(--sky)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* Header */
.top{background:linear-gradient(180deg,var(--sky),var(--sky-2));color:var(--on-sky);padding-block:10px 18px}
.hero{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center}
.kikker{width:112px;height:112px;border:0;background:none;padding:0;cursor:pointer}
.kikker svg{width:112px;height:112px;display:block}
.hello{font:600 28px/1.05 var(--display);margin:0;letter-spacing:.01em}
.say{margin:6px 0 0;font-size:15px;color:var(--on-sky)}
.next{margin-top:8px;font-size:14px;color:var(--on-sky-dim)}
.next b{color:var(--on-sky)}
.prog{margin-top:12px;height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.progtxt{display:flex;justify-content:space-between;font-size:12px;color:var(--on-sky-dim);margin-top:4px}

main{padding-block:14px 32px}
.view{display:flex;flex-direction:column;gap:12px}
h2{font:600 15px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:14px 0 2px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font:400 12px var(--body);letter-spacing:0;text-transform:none}

/* Blocks (parts of the day) */
.block{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.block.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bhead{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;width:100%;padding:12px 14px;background:none;border:0;text-align:left;cursor:pointer}
.when{font:600 17px/1 var(--display);color:var(--dim)}
.block.now .when{color:var(--accent)}
.bhead h3{margin:0;font:600 21px/1.1 var(--display);letter-spacing:.01em}
.bhead .sub{font-size:13px;color:var(--dim);margin-top:2px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--dim);white-space:nowrap}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.now{background:var(--accent-soft);color:var(--accent)}
.bbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.checks label{display:flex;gap:12px;align-items:center;padding:9px 4px;border-radius:10px;cursor:pointer}
.checks input{width:22px;height:22px;accent-color:var(--good);flex:none}
.checks input:checked + span{color:var(--dim);text-decoration:line-through}
.plan{background:var(--bg);border-radius:12px;padding:12px}
.plan b{display:block;font:600 19px/1.15 var(--display)}
.plan p{margin:4px 0 0;font-size:14px;color:var(--dim)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px}
.choice.on{background:var(--good);border-color:var(--good);color:#fff;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1206}
.btn.ghost{background:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.timer{font:600 44px/1 var(--display);letter-spacing:.02em}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--dim)}
.field input,.field textarea,.field select{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.field textarea{min-height:76px;resize:vertical}
.moods{display:flex;gap:6px}
.mood{flex:1;padding:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px;cursor:pointer}
.mood.on{border-color:var(--accent);background:var(--accent-soft)}
.note{font-size:13px;color:var(--dim)}
.saved{font-size:13px;color:var(--good);font-weight:700}

/* Goals */
.goal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.goal h3{margin:0;font-size:16px}
.goal .meta{font-size:13px;color:var(--dim)}
.dots{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dot{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dim)}
.dot i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:block}
.dot.hit i{background:var(--good);border-color:var(--good)}
.dot.today i{border-color:var(--accent)}
.score{font:600 24px/1 var(--display)}
.score.met{color:var(--good)}

/* Projects */
.proj{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;width:100%}
.proj h3{margin:0;font:600 20px/1.1 var(--display)}
.proj .meta{font-size:13px;color:var(--dim)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;gap:10px;align-items:center;padding:6px 0}
.steps li span{flex:1}
.steps li.done span{color:var(--dim);text-decoration:line-through}
.x{border:0;background:none;color:var(--dim);cursor:pointer;padding:4px 8px;font-size:16px}
.loglist{list-style:none;margin:0;padding:0;font-size:14px;display:flex;flex-direction:column;gap:6px}
.loglist time{color:var(--dim);font-size:12px;display:block}

/* Settings */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tab{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;background:none;border:0;color:var(--dim);font-size:12px;font-weight:700;cursor:pointer}
.tab.on{color:var(--accent)}

/* Sheet */
.sheet{position:fixed;inset:0;background:rgba(5,12,18,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.panel{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font:600 24px var(--display)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="hero">
      <button class="kikker" id="kikker" aria-label="Kikker">…</button>
      <div>
        <h1 class="hello" id="hello">Hi</h1>
        <p class="say" id="say"></p>
        <div class="next" id="next"></div>
      </div>
    </div>
    <div class="prog" aria-hidden="true"><i id="progBar" style="width:0%"></i></div>
    <div class="progtxt"><span id="progTxt"></span><span id="dateTxt"></span></div>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-today"></section>
  <section class="view" id="view-goals" hidden></section>
  <section class="view" id="view-projects" hidden></section>
  <section class="view" id="view-settings" hidden></section>
</main>

<nav class="tabs" aria-label="Views">
  <button class="tab on" data-tab="today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button class="tab" data-tab="goals"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>Goals</button>
  <button class="tab" data-tab="projects"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/></svg>Projects</button>
  <button class="tab" data-tab="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>

<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="kikker.js"></script>
<script src="app.js"></script>
</body>
</html>
